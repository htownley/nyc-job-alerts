name: NYC job alerts

on:
  schedule:
    # The NYC Jobs dataset refreshes in the afternoon ET, so an evening run
    # catches that day's new postings same-day. Time is UTC (no DST) — that's
    # ~6 PM Eastern in EDT, shifting to ~5 PM in EST.
    - cron: "0 22 * * *"   # ~6:00 PM ET
  workflow_dispatch:      # lets you run it on demand from the Actions tab
    inputs:
      since_days:
        description: "Catch-up: email ALL open matches posted in the last N days (leave blank for the normal daily digest)"
        required: false
        default: ""

permissions:
  contents: write  # needed to commit the updated seen_jobs.json state

concurrency:
  group: nyc-job-alerts
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send digest
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          SINCE_DAYS: ${{ github.event.inputs.since_days }}
        run: python job_alerts.py

      - name: Persist seen-jobs state
        run: |
          if [[ -n "$(git status --porcelain seen_jobs.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "Update seen jobs state"
            git push
          else
            echo "No state changes to commit."
          fi
