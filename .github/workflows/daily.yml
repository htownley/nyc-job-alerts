name: NYC job alerts

on:
  schedule:
    # 11:00 UTC = 7:00 AM America/New_York (EDT). Adjust as you like.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # lets you run it on demand from the Actions tab

permissions:
  contents: write  # needed to commit the updated seen_jobs.json state

concurrency:
  group: nyc-job-alerts
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send digest
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: python job_alerts.py

      - name: Persist seen-jobs state
        run: |
          if [[ -n "$(git status --porcelain seen_jobs.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "Update seen jobs state"
            git push
          else
            echo "No state changes to commit."
          fi
